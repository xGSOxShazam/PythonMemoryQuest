name: Publish saved game version
on:
  workflow_dispatch:
    inputs:
      version:
        description: Game version to publish (main returns to the current game)
        required: true
        type: choice
        default: version-1
        options:
          - version-1
          - version-2
          - version-3
          - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish selected version
        id: deployment
        uses: actions/deploy-pages@v4
